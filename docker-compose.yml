version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cires_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: gradle:8.5-jdk17 
    working_dir: /app
    volumes:
      - ./backend:/app
      - gradle_cache:/home/gradle/.gradle 
    ports:
      - "8080:8080"
    command: gradle bootRun 
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

volumes:
  gradle_cache:
  pgdata: